.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-hero{background:linear-gradient(160deg,#064f4c,#087d79);color:#fff;padding:56px 60px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.auth-brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.02em;font-size:17px}
.auth-brand i{width:40px;height:40px;border-radius:11px;background:#ffffff26;display:grid;place-items:center}
.auth-brand svg{width:24px;height:24px}
.auth-hero h2{font-size:34px;line-height:1.2;letter-spacing:-.8px;font-weight:700;max-width:460px;margin-bottom:14px}
.auth-hero p{color:#ffffffcc;max-width:440px;line-height:1.7;font-size:14px}
.auth-points{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px;max-width:460px}
.auth-points li{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:#ffffffe6;line-height:1.6}
.auth-points b{display:block;font-size:13px;color:#fff}
.auth-points span.dot{flex:0 0 26px;height:26px;border-radius:8px;background:#ffffff22;display:grid;place-items:center;font-size:12px;font-weight:700}
.auth-hero small{color:#ffffff99;font-size:11px}
.auth-panel{display:grid;place-items:center;padding:32px 24px}
.auth-card{width:100%;max-width:420px;padding:34px}
.auth-card h1{font-size:26px;margin:0 0 8px}
.auth-card .lead{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:24px}
.auth-card .field{margin-bottom:16px}
.auth-card .field label{font-size:12px}
.auth-card input{font-size:14px;padding:12px 14px;min-height:44px}
.auth-card input:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-pale)}
.auth-forgot{display:flex;justify-content:flex-end;margin:-4px 0 18px}
.auth-card .btn.primary{width:100%;min-height:44px;font-size:14px}
.auth-divider{display:flex;align-items:center;gap:12px;color:#9aa8b2;font-size:11px;margin:20px 0 14px}
.auth-divider:before,.auth-divider:after{content:"";flex:1;height:1px;background:var(--line)}
.auth-card .btn.alt{width:100%}
.auth-msg{min-height:20px;margin-top:14px;font-size:12px;line-height:1.7;color:#ad503f}
.auth-note{margin-top:20px;padding:12px 14px;background:var(--teal-pale);border-radius:10px;color:#3f7f78;font-size:12px;line-height:1.7}

function sortRows(rows){
 const so=v=>v.sort_order==null?Infinity:v.sort_order;
 const block={};for(const v of rows){const k=v.customer||'',c=String(v.createdAt||'');if(!(k in block)||c<block[k])block[k]=c;}
 const auto=(a,b)=>{const ka=a.customer||'',kb=b.customer||'',ba=block[ka]||'',bb=block[kb]||'',pa=custPriority(ka),pb=custPriority(kb);
  return (!a.customer)-(!b.customer)||(pa-pb)||(ba<bb?-1:ba>bb?1:0)||(ka!==kb?ka.localeCompare(kb,'tr'):0)||statusTier(a)-statusTier(b)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.createdAt.localeCompare(b.createdAt);};

tional:true})}${field('registration','Ruhsat',v.registration,{optional:true})}<div class="field full"><label for="f-note">Operasyon notu <span class="optional">(iste\u011fe ba\u011fl\u0131)</span></label><textarea id="f-note" name="note" maxlength="1000" placeholder="Evrak durumu, bekleme nedeni veya k\u0131sa not...">${esc(v.note)}</textarea></div></div><div class="form-status">${[['onsite','TES\u0130STE'],['t1','T1 YAZILDI'],['done','\u0130\u015eLEMLER B\u0130TT\u0130']].map(([k,l])=>`<label><input type="checkbox" class="check ${k}" name="${k}" ${v[k]?'checked':''}>${l}</label>`).join('')}</div><p class="form-note">Bu geli\u015fe \u00f6zel de\u011fi\u015fiklikler ana plaka kayd\u0131n\u0131 veya ge\u00e7mi\u015f haftalar\u0131 etkilemez. Durum kutular\u0131 birbirinden ba\u011f\u0131ms\u0131zd\u0131r.</p><div id="form-error" hidden></div></div><div class="modal-footer">${button('close-modal','Vazge\u00e7')}<button type="submit" class="btn primary">${icon('check')}Geli\u015fi kaydet</button></div></form>`);}

function visitFields(form){const f=new FormData(form);return {plate:plateText(f.get('plate')),customer:String(f.get('customer')||'').trim(),declaration:String(f.get('declaration')||'').trim(),carrier:String(f.get('carrier')||'').trim(),registration:String(f.get('registration')||'').trim(),date:String(f.get('date')||''),time:String(f.get('time')||''),note:String(f.get('note')||'').trim(),onsite:f.has('onsite'),t1:f.has('t1'),done:f.has('done')};}
function handlePlate(){const form=document.getElementById('visit-form');if(!form)return;const p=form.elements.plate.value,r=matchPlate(p),hint=document.getElementById('plate-hint');if(r){if(form.dataset.matched!==norm(p)){for(const k of ['customer','declaration','carrier','registration'])form.elements[k].value=r[k]||'';form.dataset.matched=norm(p);}hint.className='match-hint matched';hint.innerHTML=`${icon('check')} ${esc(r.customer)} \u00b7 Kay\u0131tl\u0131 plakadan bilgiler getirildi.`;}else if(form.dataset.original===norm(p)&&norm(p)){hint.className='match-hint';hint.textContent='Bu geli\u015fin mevcut bilgileri kullan\u0131l\u0131yor; ana plaka kayd\u0131 silinmi\u015f olabilir.';}else{if(form.dataset.matched){for(const k of ['customer','declaration','carrier','registration'])form.elements[k].value='';form.dataset.matched='';}hint.className='match-hint unmatched';hint.innerHTML=p.trim()?`Yeni plaka. Kaydedince Plaka Kay\u0131tlar\u0131\u2019na otomatik eklenecek.`:'Plakay\u0131 yaz\u0131n veya kay\u0131tl\u0131 ara\u00e7lardan se\u00e7in.';}}
function customerProfile(name){if(!name)return;const rows=state.visits.filter(v=>(v.customer||'')===name);const s=stats(rows);const recent=rows.slice().sort((a,b)=>b.date.localeCompare(a.date)||String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,12);
 const tiles=[['Toplam araç',s.total],['Tesiste',s.onsite],['T1 yazıldı',s.t1],['Tamamlanan',s.done]].map(([l,n])=>`<div class="kpi"><div class="kpi-top"><span>${l}</span></div><div class="kpi-num">${n}</div></div>`).join('');
 const list=recent.length?`<div class="table-scroll"><table class="report-table"><thead><tr><th>TARİH</th><th>PLAKA</th><th>BEYANNAME</th><th>DURUM</th></tr></thead><tbody>${recent.map(v=>`<tr><td>${fmt(v.date)}</td><td>${esc(v.plate)}</td><td>${esc(v.declaration)||'—'}</td><td>${v.done?'Tamamlandı':v.t1?'T1 yazıldı':v.onsite?'Tesiste':'Bekliyor'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="help-note">Bu müşteriye ait kayıt yok.</p>';
 openModal(`${modalHeader(esc(name),`${s.total} araç · tüm zamanlar`)}<div class="modal-body"><div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:18px">${tiles}</div><h3 style="margin-bottom:10px">Son araçlar</h3>${list}</div><div class="modal-footer">${button('close-modal','Kapat')}</div>`);}

async function exportExcel(mode){try{if(!window.PCSXLSX)throw new Error('Excel bile\u015feni y\u00fcklenemedi.');const selected=mode==='day'?(document.getElementById('export-day')?.value||defaultDate()):null;const data={state:structuredClone(state),year:ui.year,week:ui.week,monday:weekStart(),selectedDate:selected,demo:ui.demo,customerPriority:custPriorityList};const out=PCSXLSX.makeWorkbook(data,mode);downloadBlob(out.blob,out.name);closeModal();toast('Excel dosyas\u0131 haz\u0131rland\u0131 ve indirildi.');}catch(e){toast('Excel aktar\u0131m\u0131 tamamlanamad\u0131: '+e.message,true);}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='bulk-clear'){selectedIds.clear();render();return;}

  const key=a.slice(5);const ids=[...selectedIds];if(!ids.length)return;

 }

  catch(err){toast(err.code==='PGRST116'||/relation .app_settings. does not exist/i.test(err.message||'')?'Önce siralama-kurulumu SQL dosyasını çalıştırın (musteri-onceligi-kurulumu.sql).':friendly(err),true);}
  finally{busy=false;onlineUI();}

 }
 if(a==='register-current'){const form=document.getElementById('visit-form');pendingVisit={...visitFields(form),editingId:form.dataset.id||null};return openRegistryForm(null,pendingVisit.plate);}
 if(a==='delete-visit'){const v=state.visits.find(x=>x.id===id);if(v)confirmDialog('Ara\u00e7 geli\u015fini sil',`${v.plate} plakas\u0131n\u0131n ${fmt(v.date)} tarihli geli\u015fi silinecek. Ana plaka kayd\u0131 ve di\u011fer geli\u015fler korunur.`,async()=>{formVersion={id:v.id,updated_at:v.updated_at};if(await mutate(s=>s.visits=s.visits.filter(x=>x.id!==id))){closeModal();toast('Geli\u015f kayd\u0131 silindi.');}},'Geli\u015fi sil',true);return;}
 if(a==='delete-reg'){const r=state.registry.find(x=>x.id===id);if(r)confirmDialog('Ana plaka kayd\u0131n\u0131 sil',`${r.plate} plakas\u0131 ana kay\u0131tlardan silinecek. Ge\u00e7mi\u015f geli\u015fler korunur. Bu plaka sonraki yeni geli\u015flerde otomatik bulunamaz.`,async()=>{formVersion={id:r.id,updated_at:r.updated_at};if(await mutate(s=>s.registry=s.registry.filter(x=>x.id!==id))){closeModal();toast('Ana plaka kayd\u0131 silindi.');}},'Plakay\u0131 sil',true);return;}
 if(a==='close-modal'){pendingVisit=null;return closeModal();}

 [day[i],day[j]]=[day[j],day[i]];await saveOrder(day.map(x=>x.id));
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action="clear-order"]');if(!b||!canEdit())return;
 if(!window.confirm('Bu gün için elle ayarlanmış sıra kaldırılsın mı? Durumlara göre otomatik sıralamaya dönülecek.'))return;
 busy=true;onlineUI();
 try{const {error}=await client.from('visits').update({sort_order:null}).eq('visit_date',b.dataset.date).select('id');if(error)throw error;busy=false;await syncData();toast('Bu günün sıralaması otomatiğe döndürüldü.');}
 catch(err){toast(friendly(err),true);}
 finally{busy=false;onlineUI();}
});
document.addEventListener('dragstart',e=>{const tr=rowOf(e);if(!tr)return;if(!canEdit()||!orderReady()){e.preventDefault();return;}dragId=tr.dataset.rowId;tr.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);});
document.addEventListener('dragover',e=>{if(!dragId)return;const tr=rowOf(e);if(!tr)return;const a=state.visits.find(x=>x.id===dragId),b=state.visits.find(x=>x.id===tr.dataset.rowId);if(!a||!b||a.id===b.id||a.date!==b.date)return;e.preventDefault();e.dataTransfer.dropEffect='move';const q=tr.getBoundingClientRect(),before=e.clientY<q.top+q.height/2;document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));tr.classList.add(before?'drop-before':'drop-after');});
document.addEventListener('drop',async e=>{
 if(!dragId)return;const id=dragId;dragId=null;const tr=rowOf(e);if(!tr){dropClear();return;}
 e.preventDefault();const q=tr.getBoundingClientRect(),before=tr.classList.contains('drop-before')||(!tr.classList.contains('drop-after')&&e.clientY<q.top+q.height/2);dropClear();
 const a=state.visits.find(x=>x.id===id),b=state.visits.find(x=>x.id===tr.dataset.rowId);if(!a||!b||a.id===b.id||a.date!==b.date||!canEdit())return;
 const day=sortRows(state.visits.filter(x=>x.date===a.date)).filter(x=>x.id!==id);const k=day.findIndex(x=>x.id===b.id);day.splice(before?k:k+1,0,a);
 await saveOrder(day.map(x=>x.id));
});
document.addEventListener('dragend',()=>{dragId=null;dropClear();});setInterval(()=>{if(!document.hidden&&!dragId)syncData();},15000);
window.addEventListener('online',()=>syncData());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncData();});

authScreen();
})();

</script>
