.operations tr.row-onsite td,.operations tr.row-onsite td.actions-cell{background:color-mix(in srgb,var(--c-onsite) var(--tint),#fff)}
.operations tr.row-t1 td,.operations tr.row-t1 td.actions-cell{background:color-mix(in srgb,var(--c-t1) var(--tint),#fff)}
.operations tr.row-done td,.operations tr.row-done td.actions-cell{background:color-mix(in srgb,var(--c-done) var(--tint),#fff)}
.operations tr.is-selected td,.operations tr.is-selected td.actions-cell{background:color-mix(in srgb,var(--c-accent) 16%,#fff)}
.operations tr.is-selected td:first-child{box-shadow:inset 3px 0 0 var(--c-accent)}
.operations tr.is-selected .plate-button{color:color-mix(in srgb,var(--c-accent) 80%,#000)}
.operations tr:not(.block-head-row) td:not(.check-cell):not(.actions-cell){padding-top:var(--row-pad);padding-bottom:var(--row-pad)}
.operations td.plate,.operations td.plate .plate-button{font-family:var(--plate-font);font-size:var(--plate-size)}
.side-plate{font-family:var(--plate-font)}
.block-head-bar{background:color-mix(in srgb,var(--bc,#3453d1) var(--head-mix),#fff)}
html[data-head-align="left"] .block-head-bar{justify-content:flex-start}
html[data-spacing] :is(#app,#modal) :is(td,p,span,label,button,a,li,small,b,strong,select,h1,h2,h3){letter-spacing:var(--ui-spacing)}
.btn.primary{background:var(--c-brand);border-color:var(--c-brand);color:var(--c-brand-fg)}
.btn.primary:hover{background:var(--c-brand);border-color:var(--c-brand);filter:brightness(.88)}
.day-tab.active{background:var(--c-brand);border-color:var(--c-brand);color:var(--c-brand-fg)}
.day-tab.active strong{color:var(--c-brand-fg)}.day-tab.active small{color:var(--c-brand-fg);opacity:.8}
.day-tab.active .tab-count{background:var(--c-accent);color:var(--c-accent-fg)}
.kpi.teal{background:var(--c-brand);border-color:var(--c-brand)}
.day-date,.avatar{background:var(--c-brand);color:var(--c-brand-fg)}.day-date b{color:var(--c-brand-fg)}
#toast{background:var(--c-brand);color:var(--c-brand-fg)}
.nav-item.active{background:color-mix(in srgb,var(--c-accent) 12%,#fff);color:color-mix(in srgb,var(--c-accent) 80%,#000)}
.brand-mark{background:var(--c-accent);color:var(--c-accent-fg)}
.eyebrow,.btn.text,a{color:color-mix(in srgb,var(--c-accent) 85%,#000)}
.sidebar-user small{color:color-mix(in srgb,var(--c-accent) 85%,#000)}
.chip-prev.brand{background:var(--c-brand);color:var(--c-brand-fg)}
.chip-prev.accent{background:var(--c-accent);color:var(--c-accent-fg)}
.app-card{display:flex;flex-direction:column;gap:0}
.app-section{padding:18px 0;border-top:1px solid var(--line)}
.app-section h3{font-size:14px;font-weight:800;margin-bottom:12px}
.app-hint{display:block;margin-top:10px;font-size:12px;color:#4f5d73;line-height:1.6}
.app-presets{display:flex;flex-wrap:wrap;gap:8px}
.app-preset-btn{min-width:130px}
.app-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.app-colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.app-color-item{display:flex;align-items:center;gap:12px;cursor:default}
.app-color-text{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.app-color-text span{font-size:12px;font-weight:800;color:#3e4c63}
.app-hex{width:110px;min-height:34px;padding:6px 10px;font-family:ui-monospace,Consolas,monospace;font-size:13px;text-transform:none!important}
.app-preview .preview-ops{min-width:0!important;width:100%;table-layout:auto}
.app-preview{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.preview-ops .chk-toggle,.preview-ops .chip-prev{display:inline-flex;white-space:nowrap;padding:6px 10px;min-width:82px;min-height:32px;justify-content:center;align-items:center;font-size:11px;border-radius:8px}
.app-preview-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.app-mini{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;cursor:default;width:auto;margin:0}
.app-actions{position:sticky;bottom:0;background:#fff;padding:14px 0 2px;border-top:1px solid var(--line);margin-top:0}
/*logo*/
.brand-mark,.brand-mark:is(*){background:transparent!important;width:44px;height:44px;padding:0;border-radius:11px;overflow:hidden;box-shadow:0 2px 6px #16233a26}
.brand-mark img{width:100%;height:100%;display:block}
.auth-logo{background:transparent!important;width:52px!important;height:52px!important;border-radius:13px!important;overflow:hidden;box-shadow:0 0 0 2px #ffffff33}
.auth-logo img{width:100%;height:100%;display:block}
/*yazi-kalinligi-tum-sayfa*/
html[data-weight="ince"] :is(#app,#modal) :not(svg,svg *,h1,h2,h3,.kpi-num,.brand-name,.block-head-name,.side-plate){font-weight:400}
html[data-weight="bold"] :is(#app,#modal) :not(svg,svg *,h1,h2,h3,.kpi-num,.brand-name,.block-head-name,.side-plate,.eyebrow,.nav-label){font-weight:700}
html[data-weight="extra"] :is(#app,#modal) :not(svg,svg *){font-weight:800}
html[data-weight="black"] :is(#app,#modal) :not(svg,svg *){font-weight:900}
/*kompakt-toplamlar*/
.kpi-grid{gap:10px;margin-bottom:18px}
.kpi{padding:11px 14px;border-radius:12px}
.kpi-top{font-size:10px;letter-spacing:.08em}
.kpi-icon{width:24px;height:24px;border-radius:7px}.kpi-icon svg{width:14px;height:14px}
.kpi-num{font-size:24px;line-height:1.15;margin-top:4px}
.kpi-note{font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-progress{margin-top:7px}
.section-label{margin-bottom:8px}.section-label h2{font-size:13px}.section-label span{font-size:11px}
/*musteri-blok-ayrimi*/
.operations tr.block-head-row td{padding:18px 0 0!important;background:var(--bg)!important;border:0!important}
.operations tbody tr.block-head-row:first-child td{padding-top:0!important;background:transparent!important}
.block-head-bar{border-radius:12px 12px 0 0;border-top:0;box-shadow:inset 0 4px 0 var(--bc,#3453d1)}
.operations tbody tr.block-head-row:first-child .block-head-bar{border-radius:0}
.operations tr[style*="--bc"] td.num{box-shadow:inset 6px 0 0 var(--bc)}
.operations tr[style*="--bc"] td.num{padding-left:16px}
.preview-ops tr.block-head-row td{padding-top:0!important}
.operations tr[style*="--bc"] td.actions-cell{box-shadow:inset -6px 0 0 var(--bc),-10px 0 10px -10px #16233a1f;padding-right:14px}
/*plaka-rozeti*/
.lp{display:inline-flex;align-items:stretch;height:32px;border-radius:6px;overflow:hidden;background:#fff;border:2px solid #16233a;box-shadow:0 1px 2px #16233a1f;vertical-align:middle;max-width:100%}
.lp-band{width:24px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;padding-bottom:3px;background:#1f4fb8;color:#fff}
.lp-band svg{width:14px;height:14px}
.lp-band b{font-size:9px;font-weight:800;line-height:1;color:#fff;letter-spacing:.02em}
.lp-num{display:flex;align-items:center;padding:0 10px;font-family:var(--plate-font,"Arial Narrow",Arial,sans-serif);font-weight:800;font-size:17px;letter-spacing:.05em;color:#111827;white-space:nowrap;overflow:hidden}
.lp-unknown .lp-band{background:#8a96a8}
.lp-sep{display:inline-block;flex:none;width:2px;height:16px;background:#16233a;opacity:.5;margin:0 8px;border-radius:2px}
.lp-cc2{font-style:normal;font-size:.62em;font-weight:800;color:#fff;background:#1f4fb8;padding:2px 4px;border-radius:3px;margin-right:6px}
.lp-sm{height:27px;border-width:1.5px}.lp-sm .lp-band{width:20px}.lp-sm .lp-band svg{width:11px;height:11px}.lp-sm .lp-band b{font-size:8px}.lp-sm .lp-num{font-size:var(--plate-size,14px);padding:0 8px}.lp-sm .lp-sep{height:13px;margin:0 7px}
.lp-lg{height:40px}.lp-lg .lp-band{width:28px}.lp-lg .lp-band svg{width:16px;height:16px}.lp-lg .lp-num{font-size:20px}
.plate-button .lp{cursor:pointer}.plate-button:hover{text-decoration:none}.plate-button:hover .lp{border-color:var(--c-accent)}
.lp-plain{font-weight:800}
.app-plate-demo{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
/*durum-simgeleri*/
.chk-toggle{gap:5px}.chk-toggle svg{width:15px;height:15px;stroke-width:2}
.check-native:checked+.chk-toggle:before{content:none}
html[data-st-icons="off"] .check-native:checked+.chk-toggle:before{content:"\2713";margin-right:4px}
.chip-prev svg{width:15px;height:15px;margin-right:5px;stroke-width:2}
.flow-step i svg{width:15px;height:15px;stroke-width:2}
.board-main .operations{min-width:940px}
.operations col:nth-child(5){width:17%!important}.operations col:nth-child(6){width:27%!important}.operations col:nth-child(7){width:28%!important}
.board-main .operations tr:not(.block-head-row) td:nth-child(7){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/*sade-kurumsal-gorunum*/
html[data-head-style="minimal"] .block-head-bar{background:#fff;box-shadow:inset 4px 0 0 var(--bc,#3453d1);border-bottom:1px solid var(--line);padding:12px 18px}
html[data-head-style="minimal"] .operations tr.block-head-row td{padding-top:14px!important}
html[data-head-style="minimal"] .operations tbody tr.block-head-row:first-child td{padding-top:0!important}
html[data-head-style="minimal"] .block-head-name{font-size:15px;color:var(--ink);letter-spacing:.05em}
html[data-head-style="minimal"] .block-head-name:before{width:10px;height:10px;box-shadow:none}
html[data-head-style="minimal"] .block-head-count{background:#f1f3f7;border-color:transparent;color:#3e4c63}
html[data-head-style="minimal"] .card-head{border:1px solid var(--line)}
html[data-row-style="minimal"] .operations tr.row-onsite td,html[data-row-style="minimal"] .operations tr.row-t1 td,html[data-row-style="minimal"] .operations tr.row-onsite td.actions-cell,html[data-row-style="minimal"] .operations tr.row-t1 td.actions-cell{background:#fff}
html[data-row-style="minimal"] .operations tr.row-done td,html[data-row-style="minimal"] .operations tr.row-done td.actions-cell{background:color-mix(in srgb,var(--c-done) 6%,#fff)}
html[data-row-style="minimal"] .operations tr.is-selected td,html[data-row-style="minimal"] .operations tr.is-selected td.actions-cell{background:color-mix(in srgb,var(--c-accent) 9%,#fff)}
html[data-row-style="minimal"] .operations tbody tr:not(.block-head-row):hover td{background:#f5f7fb;filter:none}
html[data-row-style="minimal"] .operations tr td.declaration{border-left-color:transparent}
html[data-row-style="minimal"] .operations tr[style*="--bc"] td.actions-cell{box-shadow:-10px 0 10px -10px #16233a1f}
html[data-row-style="minimal"] .operations tr[style*="--bc"] td.num{box-shadow:inset 4px 0 0 var(--bc)}
html[data-row-style="minimal"] .vcard.done{background:color-mix(in srgb,var(--c-done) 5%,#fff)}
/*cilalama: gomulu yazi tipi*/
@font-face{font-family:"PCS Roboto";src:url(fonts/Roboto-Light.ttf) format("truetype");font-weight:300;font-display:swap}
@font-face{font-family:"PCS Roboto";src:url(fonts/Roboto-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:"PCS Roboto";src:url(fonts/Roboto-Medium.ttf) format("truetype");font-weight:500 600;font-display:swap}
@font-face{font-family:"PCS Roboto";src:url(fonts/Roboto-Bold.ttf) format("truetype");font-weight:700 900;font-display:swap}
/*cilalama: yumusak durum dugmeleri*/
html[data-chip-style="soft"] .check-native:checked+.chk-toggle.amber,html[data-chip-style="soft"] .check-native:checked+.vc-step.onsite{background:color-mix(in srgb,var(--c-onsite) 16%,#fff);border-color:color-mix(in srgb,var(--c-onsite) 60%,#fff);color:color-mix(in srgb,var(--c-onsite) 58%,#000)}
html[data-chip-style="soft"] .check-native:checked+.chk-toggle.blue,html[data-chip-style="soft"] .check-native:checked+.vc-step.t1{background:color-mix(in srgb,var(--c-t1) 12%,#fff);border-color:color-mix(in srgb,var(--c-t1) 50%,#fff);color:color-mix(in srgb,var(--c-t1) 80%,#000)}
/*cilalama: islem simgeleri uzerine gelince*/
@media (hover:hover){.operations td.actions-cell .icon-btn{opacity:.28}.operations tbody tr:hover td.actions-cell .icon-btn,.operations td.actions-cell .icon-btn:focus-visible{opacity:1}}
/*cilalama: kucuk whatsapp basligi*/
.block-head-bar .wa-head{width:30px;height:30px;min-width:30px;padding:0;justify-content:center;font-size:0!important;letter-spacing:0;gap:0;border-radius:99px;overflow:hidden;flex:none}
.block-head-bar .wa-head svg{width:16px;height:16px}
/*cilalama: sayilar, tireler, eksik etiketi*/
.board-main .operations th:nth-child(8),.board-main .operations tr:not(.block-head-row) td:nth-child(8){text-align:right}
.operations td:nth-child(8),.kpi-num,.day-stats b{font-variant-numeric:tabular-nums}
.dash{color:#b5bdc9;font-weight:500}
.missing-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:#fff4e5;color:#b45309;border:1px solid #f5d0a0;font-size:11px;font-weight:800;letter-spacing:.06em}
/*cilalama: yazi hiyerarsisi*/
.board-main .operations td.declaration{color:var(--ink);font-weight:600}
.board-main .operations tr:not(.block-head-row) td:nth-child(7){color:#3e4c63;font-weight:500}
.board-main .operations tr:not(.block-head-row) td:nth-child(8){color:#3e4c63;font-weight:600}
/*cilalama: sabit tablo basligi*/
@media(min-width:1100px){.board-main .day-block{overflow:clip}.board-main .table-scroll{overflow:visible}.board-main .operations thead th{position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--line)}}
/*cilalama: ince ust kisim*/
.heading{margin-bottom:14px}.heading h1{font-size:24px}.heading p{display:none}.eyebrow{margin-bottom:4px}
.warning-banner,.demo-banner{padding:8px 12px;margin-bottom:12px}
.period-panel{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 14px;margin-bottom:14px}
.period-top{flex:0 1 auto;gap:10px}
.period-panel #day-select{display:none}
.day-tabs{flex:1 1 620px;margin:0;padding:0;border:0;gap:6px}
.day-tab{padding:7px 10px}.day-tab strong{margin:0}.day-tab small{display:none}
.section-label{margin-bottom:6px}.section-label span{display:none}
.kpi-grid{margin-bottom:14px}
.kpi{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;row-gap:0;align-items:center;padding:9px 14px}
.kpi-top{grid-column:2;grid-row:1}.kpi-icon{display:none}
.kpi-num{grid-column:1;grid-row:1/3;font-size:26px;margin:0;line-height:1}
.kpi-note{grid-column:2;grid-row:2;margin:0}
.kpi-progress{grid-column:1/-1;margin-top:6px}
/*cilalama: yumusak gecisler*/
.chk-toggle,.vc-step,.flow-step,.btn,.icon-btn,.day-tab,.nav-item,.wa-head{transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,opacity .15s}
@keyframes rowFlash{0%{background-color:color-mix(in srgb,var(--c-accent) 20%,#fff)}100%{}}
@keyframes chipPop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes cardFlash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent) 40%,#fff)}100%{}}
.operations tr.just-changed td{animation:rowFlash 1.4s ease-out}
.operations tr.just-changed .check-native:checked+.chk-toggle,.vcard.just-changed .check-native:checked+.vc-step{animation:chipPop .35s ease-out}
.vcard.just-changed{animation:cardFlash 1.4s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/*ayarlar-acilir-bolumler*/
.set-list{display:flex;flex-direction:column;gap:10px;max-width:1180px;padding-bottom:90px}
.set-panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.set-panel>summary{list-style:none;display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none}
.set-panel>summary::-webkit-details-marker{display:none}
.set-panel>summary:hover{background:#f7f8fb}
.set-panel>summary:focus-visible{outline:2px solid var(--c-accent);outline-offset:-2px;border-radius:14px}
.set-ic{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-accent) 10%,#fff);color:color-mix(in srgb,var(--c-accent) 85%,#000)}
.set-ic svg{width:19px;height:19px}
.set-t{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.set-t b{font-size:15px;font-weight:800;color:var(--ink)}
.set-t small{font-size:12px;color:#4f5d73;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.set-dots{display:inline-flex;gap:3px}
.set-dot{width:10px;height:10px;border-radius:99px;display:inline-block;box-shadow:0 0 0 1px #16233a1a}
.set-chev{flex:none;color:#6b7a90;transition:transform .2s}
.set-chev svg{width:18px;height:18px}
.set-panel[open]>summary{border-bottom:1px solid var(--line)}
.set-panel[open]>summary .set-chev{transform:rotate(180deg)}
.set-body{padding:18px 20px 20px}
.set-body>.card{border:0!important;box-shadow:none!important;padding:0!important;margin:0!important;background:transparent!important}
.set-body>.card>.card-header{display:none}
.set-sub{font-size:13px;font-weight:800;color:#3e4c63;letter-spacing:.06em;margin:18px 0 10px}
.set-sub:first-child{margin-top:0}
.set-preview{margin-top:18px}
.set-preview-label{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;color:#6b7a90;margin-bottom:8px}
.set-preview .check-native{pointer-events:none}
.save-bar{position:fixed;left:calc(var(--sidebar) + 24px);right:24px;bottom:18px;z-index:40;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-radius:14px;background:var(--c-brand);color:var(--c-brand-fg);box-shadow:0 10px 30px #16233a40;transform:translateY(140%);opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;max-width:1180px}
.save-bar.show{transform:none;opacity:1;pointer-events:auto}
.save-bar>span{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:inherit}
.save-bar>span svg{width:17px;height:17px}
.save-bar .btn{min-height:36px}
.save-bar .btn:not(.primary){background:transparent;color:inherit;border-color:#ffffff55}
.save-bar .btn.primary{background:#fff;color:var(--c-brand);border-color:#fff}
@media(max-width:700px){.save-bar{left:12px;right:12px;bottom:78px}}
/*canli-bildirim*/
#live-feed{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.live-item{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 12px 32px #16233a26;text-align:left;font:inherit;color:var(--ink);text-transform:uppercase;animation:liveIn .3s ease-out;transition:opacity .35s,transform .35s}
button.live-item{cursor:pointer}button.live-item:hover{border-color:#c5cedb}
.live-item.out{opacity:0;transform:translateX(20px)}
.live-dot{width:10px;height:10px;border-radius:99px;flex:none;background:var(--c-accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-accent) 18%,#fff)}
.live-item.k-onsite .live-dot{background:var(--c-onsite);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-onsite) 20%,#fff)}
.live-item.k-t1 .live-dot{background:var(--c-t1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-t1) 20%,#fff)}
.live-item.k-done .live-dot{background:var(--c-done);box-shadow:0 0 0 4px color-mix(in srgb,var(--c-done) 20%,#fff)}
.live-item.k-del .live-dot,.live-item.k-off .live-dot{background:#8a96a8;box-shadow:0 0 0 4px #eef1f5}
.live-item span{display:flex;flex-direction:column;gap:2px;min-width:0}
.live-item b{font-size:13px;font-weight:800}
.live-item small{font-size:11px;color:#6b7a90;font-weight:600}
@keyframes liveIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(max-width:700px){#live-feed{right:12px;left:12px;width:auto;bottom:80px}}
/*musteri-gecmisi*/
dialog.cp-modal{width:min(860px,calc(100% - 28px))}
.cp-head{align-items:center}
.cp-title{display:flex;align-items:center;gap:14px}

let custPriorityList=[{match:'ETL LOJ - ERVİN',color:'#2dd4bf'},{match:'ETL LOJ - KAAN',color:'#a78bfa'},{match:'LİN LOJ',color:'#f472b6'},{match:'BULTRANS',color:'#818cf8'},{match:'PLASTNAK',color:'#22d3ee'},{match:'TORNADO',color:'#facc15'},{match:'BBL',color:'#fb7185'}];

function sortRows(rows){

 const block={};for(const v of rows){const k=v.customer||'',c=String(v.createdAt||'');if(!(k in block)||c<block[k])block[k]=c;}

  return (!a.customer)-(!b.customer)||(pa-pb)||(ba<bb?-1:ba>bb?1:0)||(ka!==kb?ka.localeCompare(kb,'tr'):0)||statusTier(a)-statusTier(b)||(a.time||'99:99').localeCompare(b.time||'99:99')||a.createdAt.localeCompare(b.createdAt);};

 if(!account||busy)return;if(loading){resync=true;return;}loading=true;const stamp=generation;const prevVisits=opts.remote&&(realState?.visits||[]).length?realState.visits:null;

 }else{const [{data:nextRole,error},registry,visits]=await Promise.all([client.rpc('current_app_role'),fetchAll('registry'),fetchAll('visits')]);if(error)throw error;if(stamp!==generation)return;

async function mutate(fn){
 if(!canEdit()){toast('Düzenleyici yetkisi gerekli veya kayıt işlemi sürüyor.',true);return false;}
 const before=structuredClone(state),next=structuredClone(state);fn(next);const changes=[];
 for(const table of ['registry','visits']){const old=new Map(before[table].map(r=>[r.id,r]));for(const r of next[table]){const prior=old.get(r.id);old.delete(r.id);if(!prior||JSON.stringify(payload(prior,table))!==JSON.stringify(payload(r,table)))changes.push({table,r,prior});}for(const prior of old.values())changes.push({table,prior});}
 if(changes.length!==1){toast('Her seferinde tek kayıt değiştirin.',true);return false;}
 busy=true;onlineUI();const c=changes[0];
 try{let q;if(!c.prior)q=client.from(c.table).insert({id:c.r.id,...payload(c.r,c.table)});else{q=c.r?client.from(c.table).update(payload(c.r,c.table)):client.from(c.table).delete();q=q.eq('id',c.prior.id).eq('updated_at',formVersion?.id===c.prior.id?formVersion.updated_at:c.prior.updated_at);}
 const {data,error}=await q.select('id');if(error)throw error;if(data.length!==1)throw new Error('Kayıt başka bir kullanıcı tarafından değiştirildi veya silindi. Formu kapatıp güncel kaydı yeniden açın.');
 busy=false;await syncData();return true;
 }catch(e){toast(friendly(e),true);return false;}finally{busy=false;onlineUI();}
}

function waNumber(name){const raw=customerContacts[name]||Object.entries(customerContacts).find(([k])=>k.toLocaleUpperCase('tr-TR')===String(name||'').toLocaleUpperCase('tr-TR'))?.[1]||'';let d=String(raw).replace(/[^\d+]/g,'');if(!d)return '';if(d.startsWith('+'))return d.slice(1).replace(/\D/g,'');d=d.replace(/\D/g,'');if(d.startsWith('00'))return d.slice(2);if(d.startsWith('0'))return '90'+d.slice(1);if(d.length===10&&d.startsWith('5'))return '90'+d;return d;}
function waKey(k){return String(k).toLocaleUpperCase('tr-TR').replace(/İ/g,'I').replace(/Ü/g,'U').replace(/Ş/g,'S').replace(/Ç/g,'C').replace(/Ğ/g,'G').replace(/Ö/g,'O').replace(/I/g,'I');}
function waMessage(list){if(!list.length)return '';const v=list[0],multi=list.length>1;const mark=b=>b?'✅':'⬜';const durum=x=>`${mark(x.onsite)} Tesiste  ${mark(x.t1)} T1 yazıldı  ${mark(x.done)} İşlemler bitti`;
 const plates=list.map(x=>x.plate).join('\n');const join=f=>[...new Set(list.map(f).filter(Boolean))].join(', ');
 const vals={PLAKA:multi?plates:v.plate,PLAKALAR:plates,MUSTERI:v.customer||'',BEYANNAME:multi?join(x=>x.declaration):(v.declaration||''),NAKLIYECI:multi?join(x=>x.carrier):(v.carrier||''),RUHSAT:multi?join(x=>kgText(x.registration)):kgText(v.registration),TARIH:fmt(v.date),SAAT:multi?join(x=>x.time):(v.time||''),DURUM:multi?list.map(x=>`${x.plate}: ${durum(x)}`).join('\n'):durum(v),ADET:String(list.length)};
 const tpl=(multi?waTemplates.multi:waTemplates.single)||(multi?WA_DEFAULT.multi:WA_DEFAULT.single);
 return tpl.replace(/\{([^{}\n]{2,20})\}/g,(m,k)=>{const key=waKey(k.trim());return key in vals?vals[key]:m;}).replace(/\n{3,}/g,'\n\n').trim();}

function kgText(s){s=String(s??'').trim();if(!s)return '';const m=s.match(/^(\d[\d.,\s]*?)\s*(kg|kgs|kilo|kilogram)?\.?$/i);return m?m[1].replace(/\s+/g,'')+' KG':s;}

var PLATE_COUNTRY={TR:['Türkiye',0],BG:['Bulgaristan',1],RO:['Romanya',1],GR:['Yunanistan',1],AL:['Arnavutluk',0],UA:['Ukrayna',0],MD:['Moldova',0]};
var BG_RE=/^(A|B|BH|BP|BT|E|EB|EH|K|KH|M|H|OB|P|PA|PB|PK|PP|C|CA|CB|CC|CH|CM|CO|CT|T|TX|X|Y)\d{4}[A-Z]{1,2}$/;
var RO_RE=/^(B\d{2,3}|(AB|AR|AG|BC|BH|BN|BT|BV|BR|BZ|CS|CL|CJ|CT|CV|DB|DJ|GL|GR|GJ|HR|HD|IL|IS|IF|MM|MH|MS|NT|OT|PH|SM|SJ|SB|SV|TR|TM|TL|VS|VL|VN)\d{2,3})[A-Z]{3}$/;
function plateCountry(p){const c=String(p||'').toLocaleUpperCase('tr-TR').replace(/İ/g,'I').replace(/[\s.\-]/g,'');
 if(/^\d{2}[A-Z]{1,3}\d{2,5}$/.test(c))return 'TR';if(BG_RE.test(c))return 'BG';if(RO_RE.test(c))return 'RO';if(/^[A-Z]{3}\d{4}$/.test(c))return 'GR';if(/^[A-Z]{2}\d{3}[A-Z]{2}$/.test(c))return 'AL';if(/^[A-Z]{2}\d{4}[A-Z]{2}$/.test(c))return 'UA';if(/^[A-Z]{3}\d{3}$/.test(c))return 'MD';return '';}
function splitPlate(p){const s=String(p||'').trim();let parts=s.split(/\s*[–—\/]\s*|\s+-\s*|\s*-\s+/).filter(Boolean);if(parts.length===1)parts=s.split(/(?<=[A-ZÇĞİÖŞÜ])-(?=[A-ZÇĞİÖŞÜ])/i).filter(Boolean);return parts.slice(0,2).map(x=>x.trim().replace(/\s+/g,' '));}

const ST_NAME={onsite:'TESİSTE',t1:'T1 YAZILDI',done:'İŞLEMLER BİTTİ'};
const UNDO_FIELDS={visits:['plate','customer','declaration','carrier','registration','date','time','note','onsite','t1','done'],registry:['plate','customer','declaration','carrier','registration']};
let undoEntry=null,undoTimer=null,undoing=false;
const mutateBase=mutate;
mutate=async function(fn){const before=undoing?null:structuredClone(state);const ok=await mutateBase(fn);if(ok&&before){try{const c=diffOne(before,state);if(c)offerUndo(c);}catch(_){}}return ok;};
function diffOne(a,b){const out=[];for(const t of ['registry','visits']){const old=new Map(a[t].map(r=>[r.id,r]));for(const r of b[t]){const p=old.get(r.id);old.delete(r.id);if(!p||JSON.stringify(payload(p,t))!==JSON.stringify(payload(r,t)))out.push({t,p,r});}for(const p of old.values())out.push({t,p,r:null});}return out.length===1?out[0]:null;}
function offerUndo({t,p,r}){const plate=(r||p).plate,what=t==='visits'?'':' plaka kaydı';let label,fn;
 if(!p){label=`${plate}${what} eklendi`;fn=s=>{s[t]=s[t].filter(x=>x.id!==r.id);};}
 else if(!r){label=`${plate}${what} silindi`;fn=s=>{s[t].push(structuredClone(p));};}
 else{const k=t==='visits'?['done','t1','onsite'].find(k=>!!p[k]!==!!r[k]):null;
  label=k?`${plate} · ${ST_NAME[k]} ${r[k]?'işaretlendi':'kaldırıldı'}`:t==='visits'&&p.date!==r.date?`${plate} · ${fmt(r.date)} gününe taşındı`:`${plate}${what} güncellendi`;
  fn=s=>{const x=s[t].find(y=>y.id===p.id);if(x)for(const f of UNDO_FIELDS[t])x[f]=p[f];};}
 undoEntry={label,fn};let bar=document.getElementById('undo-bar');if(!bar){bar=document.createElement('div');bar.id='undo-bar';bar.setAttribute('role','status');document.body.appendChild(bar);}
 bar.innerHTML=`<span>${esc(label)}</span><button type="button" data-action="undo">${icon('undo')}Geri al</button><kbd>Ctrl+Z</kbd>`;bar.className='show';document.body.classList.add('has-undo');
 clearTimeout(undoTimer);undoTimer=setTimeout(hideUndo,10000);}
function hideUndo(){undoEntry=null;const bar=document.getElementById('undo-bar');if(bar)bar.className='';document.body.classList.remove('has-undo');}
async function doUndo(){if(!undoEntry||!canEdit())return;const e=undoEntry;hideUndo();undoing=true;formVersion=null;let ok=false;try{ok=await mutate(e.fn);}finally{undoing=false;}if(ok){render();toast('Geri alındı: '+e.label);}}

/* kopyala */
function stText(v){return v.done?'İŞLEMLER BİTTİ':v.t1?'T1 YAZILDI':v.onsite?'TESİSTE':'BEKLİYOR';}
function vehicleText(v){return [['PLAKA',v.plate],['MÜŞTERİ',v.customer],['BEYANNAME',v.declaration],['NAKLİYECİ',v.carrier],['RUHSAT',kgText(v.registration)],['GELİŞ',fmt(v.date)+(v.time?' '+v.time:'')],['DURUM',stText(v)]].map(([k,x])=>`${k}: ${x||'-'}`).join('\n');}
function copyLegacy(text,html){let el;if(html){el=document.createElement('div');el.innerHTML=html;el.setAttribute('contenteditable','true');}else{el=document.createElement('textarea');el.value=text;}el.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(el);
 const sel=getSelection();sel.removeAllRanges();if(html){const r=document.createRange();r.selectNodeContents(el);sel.addRange(r);}else el.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}sel.removeAllRanges();el.remove();return ok;}
async function copyOut(text,html,msg){if(copyLegacy(text,html)){toast(msg);return;}
 try{if(html&&window.ClipboardItem&&navigator.clipboard?.write)await navigator.clipboard.write([new ClipboardItem({'text/plain':new Blob([text],{type:'text/plain'}),'text/html':new Blob([html],{type:'text/html'})})]);else await navigator.clipboard.writeText(text);toast(msg);}
 catch(_){toast('Kopyalanamadı, tarayıcı izin vermedi.',true);}}function copyVisit(id){const v=state.visits.find(x=>x.id===id);if(v)copyOut(vehicleText(v),'',`${v.plate} bilgileri kopyalandı.`);}
function copyDay(d){const rows=sortRows(state.visits.filter(v=>v.date===d));if(!rows.length)return;const H=['SIRA','PLAKA','MÜŞTERİ','BEYANNAME','NAKLİYECİ','RUHSAT','SAAT','DURUM'];
 const data=rows.map((v,i)=>[i+1,v.plate,v.customer,v.declaration,v.carrier,kgText(v.registration),v.time,stText(v)].map(x=>String(x??'')));
 const text=[H,...data].map(r=>r.join('\t')).join('\n');const td='border:1px solid #cfd6e2;padding:5px 9px;font:13px Arial,sans-serif';
 const html=`<table style="border-collapse:collapse"><tr>${H.map(h=>`<th style="${td};background:#1f2a44;color:#fff;text-align:left">${h}</th>`).join('')}</tr>${data.map(r=>`<tr>${r.map(c=>`<td style="${td}">${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
 copyOut(text,html,`${fmt(d)} listesi kopyalandı (${rows.length} araç). Excel'e veya maile yapıştırabilirsiniz.`);}

function weekDays(){const m=weekStart();return [0,1,2,3,4,5].map(i=>addDays(m,i));}
function stepDay(step){if(ui.page!=='pano'||ui.search.trim())return;let days=weekDays();if(ui.day==='all'){ui.day=step>0?days[0]:days[5];return render();}let i=days.indexOf(ui.day)+step;
 if(i<0||i>5){const t=weekInfo(addDays(days[0],step*7));ui.year=t.year;ui.week=t.week;ui.collapsed.clear();days=weekDays();i=i<0?5:0;}ui.day=days[i];render();}

const THEME_KEY=STORE+'.theme';
function getTheme(){try{return localStorage.getItem(THEME_KEY)==='dark'?'dark':'light';}catch(_){return 'light';}}
function liftColor(hex,minL){const n=parseInt(hex.slice(1),16);let r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
 if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}if(l>=minL)return hex;l=minL;
 const k=x=>(x+h/30)%12,a=s*Math.min(l,1-l),f=x=>Math.round((l-a*Math.max(-1,Math.min(k(x)-3,Math.min(9-k(x),1))))*255);return '#'+[f(0),f(8),f(4)].map(x=>x.toString(16).padStart(2,'0')).join('');}
function applyTheme(){const r=document.documentElement,dark=getTheme()==='dark';if(dark)r.dataset.theme='dark';else delete r.dataset.theme;
 if(dark){r.style.setProperty('--bg','#0e1218');for(const k of ['brand','accent']){const c=/^#[0-9a-f]{6}$/i.test(appearance.colors?.[k]||'')?appearance.colors[k]:APP_DEFAULT.colors[k];const d=liftColor(c,k==='brand'?0.4:0.6);r.style.setProperty('--c-'+k,d);r.style.setProperty('--c-'+k+'-fg',textOn(d));}}
 document.querySelector('meta[name="theme-color"]')?.setAttribute('content',dark?'#0e1218':'#ffffff');}
const applyAppearanceBase=applyAppearance;
applyAppearance=function(){applyAppearanceBase();applyTheme();};
function toggleTheme(){try{localStorage.setItem(THEME_KEY,getTheme()==='dark'?'light':'dark');}catch(_){}applyAppearance();render();}

function notices(){const list=[];
 if(!VIEW_TOKEN&&(state.visits.length||state.registry.length)){let last=null;try{last=localStorage.getItem(STORE+'.backupAt');}catch(_){}
  const days=last?Math.floor((Date.now()-new Date(last).getTime())/DAY):0;
  if(!last)list.push({lvl:'bad',t:'Yedek alınmadı',d:'Bu cihazda hiç JSON yedeği indirilmemiş.',act:'backup',btn:'Şimdi yedekle'});
  else if(days>=14)list.push({lvl:'bad',t:'Yedek eski',d:`Son yedek ${days} gün önce alındı.`,act:'backup',btn:'Şimdi yedekle'});}
 const miss=state.visits.filter(v=>v.date===TODAY&&isMissing(v)).length;
 if(miss)list.push({lvl:'warn',t:'Eksik bilgi',d:`Bugün ${miss} araçta beyanname, nakliyeci veya ruhsat eksik.`,act:'notif-missing',btn:'Göster'});

 if(old)list.push({lvl:'warn',t:'Uzun bekleyen',d:`${old} araç 3 günden fazladır bekliyor.`,act:'notif-pending',btn:'Bekleyenler'});

async function sahaSubmit(){if(!canEdit())return;const raw=(document.getElementById('saha-plate')?.value||'').trim();if(!raw)return;const d=sahaDay();const m=matchPlate(raw);
 const today=state.visits.find(x=>x.date===d&&norm(x.plate)===norm(m?.plate||raw));
 if(today){if(today.onsite){toast(`${today.plate} zaten tesiste.`);ui.sahaQ=today.plate;renderSaha();return;}
  const id=today.id;justChangedMap.set(id,Date.now());if(await mutate(s=>{const v=s.visits.find(x=>x.id===id);if(v)v.onsite=true;})){ui.sahaQ='';toast(`${today.plate} tesiste olarak işaretlendi.`);render();}return;}
 if(!m||!m.customer){openVisitForm(null,d,{plate:plateText(raw),onsite:true});return;}
 const w=openElsewhere(m.plate,d);if(w.length&&!window.confirm(`${openWarnText(w)}\n\nYine de bugün için yeni giriş yapılsın mı?`))return;
 const v={id:uid(),plate:m.plate,customer:m.customer||'',declaration:m.declaration||'',carrier:m.carrier||'',registration:kgText(m.registration),date:d,time:timeNow(),note:'',onsite:true,t1:false,done:false,createdAt:new Date().toISOString()};
 if(await mutate(s=>{s.visits.push(v);})){justChangedMap.set(v.id,Date.now());ui.sahaQ='';ui.sahaTab='wait';render();toast(`${v.plate} · ${v.customer} giriş yaptı, tesiste.`);}}

/* ekrana bağlama */
const renderBase=render;
render=function(){if(account&&ui.page==='saha'){renderSaha();return;}renderBase();const tr=document.querySelector('.topbar-right');if(tr&&account)tr.insertAdjacentHTML('afterbegin',headerTools());};
document.addEventListener('input',e=>{if(e.target.id!=='saha-plate')return;ui.sahaQ=e.target.value;renderSaha();});
document.addEventListener('submit',e=>{if(e.target.id!=='saha-add')return;e.preventDefault();sahaSubmit();});
document.addEventListener('click',async e=>{
 if(ui.notifOpen&&!e.target.closest('.notif')){ui.notifOpen=false;document.querySelector('.notif-panel')?.remove();document.querySelector('.notif-btn')?.setAttribute('aria-expanded','false');}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='theme-toggle')return toggleTheme();
 if(a==='notif-toggle'){ui.notifOpen=!ui.notifOpen;return render();}
 if(a==='backup'&&b.closest('.notif-panel')){ui.notifOpen=false;setTimeout(render,400);return;}
 if(a==='notif-missing'){const t=weekInfo(TODAY);Object.assign(ui,{page:'pano',year:t.year,week:t.week,day:weekday(TODAY)>=1&&weekday(TODAY)<=6?TODAY:'all',search:'',missingOnly:true,notifOpen:false});return render();}
 if(a==='notif-pending'){Object.assign(ui,{page:'pending',pendAge:'',notifOpen:false});return render();}
 if(a==='saha-open')return setSaha(true);
 if(a==='saha-exit')return setSaha(false);
 if(a==='saha-tab'){ui.sahaTab=b.dataset.k;return renderSaha();}
 if(a==='saha-st'){if(!canEdit())return;const id=b.dataset.id,k=b.dataset.k;justChangedMap.set(id,Date.now());b.classList.toggle('on');if(!await mutate(s=>{const v=s.visits.find(x=>x.id===id);if(v)v[k]=!v[k];}))render();}
});
try{if(localStorage.getItem(SAHA_KEY)==='1'){ui.page='saha';keepAwake(true);}}catch(_){}
applyTheme();

if(VIEW_TOKEN){account={id:'public-view',email:''};role='viewer';syncData();}else authScreen();
})();

</script>
