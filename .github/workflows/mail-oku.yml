name: Müşteri maillerini oku

# 5 dakikada bir Gmail kutusundaki okunmamış müşteri maillerini okur; araç bildirimlerini sitede onay bekleyen
# "Mail" mesajı olarak kaydeder (hiçbir araç siz onaylamadan panoya eklenmez). Kurulum: supabase/MAIL.md.
# Not: GitHub zamanlanmış görevleri yoğunlukta birkaç dakika gecikebilir.
# Gerekli gizli değerler (Settings > Secrets and variables > Actions): GMAIL_ADRES (okunacak Gmail adresi),
# GMAIL_UYGULAMA_SIFRESI, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY. Eksikse görev hiçbir şey yapmadan biter.
# Elle denemek için: Actions > Müşteri maillerini oku > Run workflow.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mail-oku
  cancel-in-progress: false

jobs:
  oku:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/mail-oku/package-lock.json
      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund
        working-directory: scripts/mail-oku
      - name: Mailleri oku
        run: node scripts/mail-oku/oku.mjs
        env:
          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_UYGULAMA_SIFRESI: ${{ secrets.GMAIL_UYGULAMA_SIFRESI }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
