name: Supabase'i canlı tut

# Supabase'in ücretsiz planı 7 gün hiç kullanılmayan projeyi duraklatır (ör. uzun bir bayram tatilinde
# site açılmaz). Bu görev her gün veritabanına kısa bir okuma isteği atar; hiçbir veriyi değiştirmez.
# Proje duraklamışsa ya da ulaşılamıyorsa görev kırmızı olur ve GitHub e-posta gönderir.
# Adres ve anahtar sitedeki app.js'ten okunur (sitede zaten herkese açık olan "publishable" anahtar).

on:
  schedule:
    - cron: '23 5 * * *'   # her gün 08:23 (İstanbul)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: app.js
          sparse-checkout-cone-mode: false
      - name: Veritabanına kısa istek
        run: |
          URL="$(grep -o "https://[a-z0-9]*\.supabase\.co" app.js | head -1)"
          KEY="$(grep -o "sb_publishable_[A-Za-z0-9_-]*" app.js | head -1)"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::error::app.js içinde Supabase adresi ya da anahtarı bulunamadı."; exit 1; fi
          # Güvenlik ekranı fonksiyonu geçersiz bir anahtarla çağrılır: fonksiyon veritabanında çalışır ve
          # "Güvenlik linki geçersiz" (42501) der. Bu yanıt isteğin veritabanına gerçekten ulaştığını gösterir.
          code=$(curl -sS -o yanit.json -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 20 \
                 -X POST -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_token":"canli-tut"}' \
                 "$URL/rest/v1/rpc/guard_board" || true)
          if grep -q '42501' yanit.json 2>/dev/null; then
            echo "Supabase yanıtı: HTTP $code · $(head -c 200 yanit.json)"
            echo "Veritabanı çalışıyor."
            exit 0
          fi
          echo "Supabase yanıtı: HTTP $code"
          [ "$code" = "200" ] && { echo "Veritabanı çalışıyor."; exit 0; }
          head -c 300 yanit.json 2>/dev/null; echo
          echo "::error::Supabase'e ulaşılamadı ya da beklenmeyen yanıt (HTTP $code). Proje duraklamış olabilir: Supabase panelinde projeyi açıp 'Restore project' deyin."
          exit 1
