name: Nakliye bildirimlerini WhatsApp'tan gönder

# 5 dakikada bir nakliye bildirim kuyruğuna (shp_outbox) bakar; bekleyen haberleri (yük depoya geldi, araç yola çıktı,
# teslim edildi, sorun, ofis mesajı) müşterinin kendi yazdığı numaraya WhatsApp Cloud API ile gönderir.
# İSTEĞE BAĞLIDIR: gizli değerler yoksa görev hiçbir şey yapmadan biter; bildirimler sitede ofis > Bildirimler sekmesinde
# "WhatsApp'ta gönder" düğmesiyle elle gönderilmeye devam eder. Kurulum: supabase/NAKLIYE.md > "Otomatik bildirim".
# Gerekli gizli değerler (Settings > Secrets and variables > Actions): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# WA_TOKEN (WhatsApp Cloud API erişim anahtarı), WA_PHONE_ID (WhatsApp telefon numarası kimliği).
# İsteğe bağlı: WA_SABLON (Meta'da onaylı şablon adı; tek gövde değişkeni olmalı. Müşteri son 24 saatte yazmadıysa Meta yalnızca şablon kabul eder).
# Elle denemek için: Actions > Nakliye bildirimlerini WhatsApp'tan gönder > Run workflow.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bildirim-gonder
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bildirimleri gönder
        run: node scripts/bildirim/gonder.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_SABLON: ${{ secrets.WA_SABLON }}
